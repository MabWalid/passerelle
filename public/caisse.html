<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caisse – démo Passerelle</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f3;color:#1d2a2a;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
@media(prefers-color-scheme:dark){body{background:#121a1a;color:#eef3f1}input,select{background:#1a2524!important;color:inherit}}
main{width:100%;max-width:420px}h1{font-size:28px;margin:0 0 4px}p{color:#6b7878;margin:0 0 18px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid #d9d2c3;border-radius:8px;font:inherit;background:#fff}
button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:#f08a00;color:#1d1200;font:600 17px system-ui;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2aa6a0;outline-offset:2px}
#log{margin-top:16px;font-size:14px;min-height:22px}.ok{color:#1f8a84}.ko{color:#c0392b}
</style></head><body><main>
<h1>Caisse</h1><p>Simule un passage en magasin : le ticket arrive sur la carte du client.</p>
<label for="n">Numéro de la carte scannée</label><input id="n" inputmode="numeric" value="3012345678905">
<label for="m">Magasin</label>
<select id="m"></select>
<label for="a">Montant (€)</label><input id="a" type="number" step="0.01" min="0.01" value="23.40">
<button id="go">Passer en caisse</button><div id="log" role="status"></div>
</main><script>
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
fetch("/api/brands").then(r=>r.json()).then(bs=>{$("m").innerHTML=bs.map(b=>`<option>${esc(b.name)}</option>`).join("")});
$("go").onclick=async()=>{
 const r=await fetch(`/api/cards/${$("n").value.trim()}/receipt`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({montant:$("a").value,magasin:$("m").value})});
 const d=await r.json();$("log").className=r.ok?"ok":"ko";
 $("log").textContent=r.ok?`Ticket envoyé. Solde : ${d.card.pts} points.`:d.error;
 if(r.ok)$("a").value=(Math.random()*60+3).toFixed(2)};
</script></body></html>
